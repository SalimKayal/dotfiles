general {
    ignore_empty_input = true
}

auth {
    fingerprint:enabled        = true
    fingerprint:ready_message  = (Touch fingerprint sensor to unlock)
    fingerprint:present_message = Scanning...
    fingerprint:retry_delay    = 250
}

background {
    color = rgb(002b36)
}

input-field {
    size             = 300, 50
    outline_thickness = 3
    outer_color      = rgb(2aa198)
    inner_color      = rgb(073642)
    font_color       = rgb(93a1a1)
    fail_color       = rgb(dc322f)
    placeholder_text = <span foreground="##586e75">…</span>
    fade_on_empty    = false
}

label {
    text      = $TIME
    color     = rgb(839496)
    font_size = 42
    position  = 0, 120
    halign    = center   # ← separate line
    valign    = center   # ← separate line
}

