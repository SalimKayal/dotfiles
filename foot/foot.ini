# ══ [main] ════════════════════════════════════════════════════
term=foot
app-id=foot
font=MonaspiceNe Nerd Font Mono:size=11
font-bold=MonaspiceNe Nerd Font Mono:size=11:weight=bold
font-italic=MonaspiceNe Nerd Font Mono:size=11:slant=italic
font-bold-italic=MonaspiceNe Nerd Font Mono:size=11:weight=bold:slant=italic
pad=6x6

selection-target=primary

[desktop-notifications]
inhibit-when-focused=yes


# ══ [scrollback] — tmux owns this ═════════════════════════════
[scrollback]
lines=1000
multiplier=3.0

# ══ [cursor] ══════════════════════════════════════════════════
[cursor]
style=block
blink=no

# ══ [colors-dark] — Solarized Dark + opacity 0.8 ══════════════
[colors-dark]
alpha=0.8
alpha-mode=default

background=002b36
foreground=839496

regular0=073642
regular1=dc322f
regular2=859900
regular3=b58900
regular4=268bd2
regular5=d33682
regular6=2aa198
regular7=eee8d5

bright0=002b36
bright1=cb4b16
bright2=586e75
bright3=657b83
bright4=839496
bright5=6c71c4
bright6=93a1a1
bright7=fdf6e3

# ══ [csd] — alacritty: decorations = "None" ═══════════════════
[csd]
preferred=none

# ══ [tweak] ═══════════════════════════════════════════════════
[tweak]
sixel=yes
surface-bit-depth=8-bit
overflowing-glyphs=yes
font-monospace-warn=no

